<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kindle ↔ Audible Sync</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 25px auto;
      padding: 18px;
      font-size: 18px;
    }

    .box {
      border: 1px solid #aaa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 19px;
      padding: 12px;
      margin: 6px 0;
    }

    .result {
      margin-top: 12px;
      font-size: 23px;
      font-weight: bold;
    }

    .saved {
      margin-top: 8px;
      font-size: 16px;
    }

    .small {
      font-size: 14px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

<h2>A Game of Thrones</h2>

<div class="box">

  <h3>🎧 Audible → Kindle</h3>

  <p>Audible time remaining:</p>

  <input id="audibleTime" placeholder="e.g. 10:29">

  <button onclick="audibleToKindle()">
    Find Kindle position
  </button>

  <div id="kindleResult" class="result"></div>

  <button
    id="saveKindleButton"
    style="display:none"
    onclick="saveKindle()">
    Save as last Kindle position
  </button>

</div>


<div class="box">

  <h3>📖 Kindle → Audible</h3>

  <p>Kindle position:</p>

  <input id="kindlePosition" type="number" placeholder="e.g. 9173">

  <button onclick="kindleToAudible()">
    Find Audible position
  </button>

  <div id="audibleResult" class="result"></div>

  <button onclick="saveEnteredKindle()">
    Save this Kindle position
  </button>

</div>


<div class="box">

  <h3>💾 Last saved reading position</h3>

  <div id="savedPosition" class="saved">
    No position saved yet.
  </div>

  <button onclick="continueOnAudible()">
    Continue on Audible
  </button>

</div>

<div class="small">
Calibrated for your AZW3 Kindle edition.
</div>


<script>

const anchors = [
  { remaining: 1579, position: 2947 },
  { remaining: 761,  position: 8086 },
  { remaining: 671,  position: 8684 },
  { remaining: 629,  position: 8938 },
  { remaining: 590,  position: 9173 },
  { remaining: 174,  position: 11688 }
];

let predictedKindle = null;


// ---------- time parsing ----------

function parseTime(text) {

  const parts = text.trim().split(":").map(Number);

  if (parts.length === 2)
    return parts[0] * 60 + parts[1];

  if (parts.length === 3)
    return parts[0] * 60 + parts[1] + parts[2] / 60;

  return NaN;
}


function formatTime(minutes) {

  const totalSeconds =
    Math.round(minutes * 60);

  const h =
    Math.floor(totalSeconds / 3600);

  const m =
    Math.floor((totalSeconds % 3600) / 60);

  const s =
    totalSeconds % 60;

  return (
    h + ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );
}


// ---------- Audible -> Kindle ----------

function estimatePosition(t) {

  for (let i = 0; i < anchors.length - 1; i++) {

    const a = anchors[i];
    const b = anchors[i + 1];

    if (t <= a.remaining && t >= b.remaining) {

      const f =
        (a.remaining - t) /
        (a.remaining - b.remaining);

      return Math.round(
        a.position +
        f * (b.position - a.position)
      );
    }
  }

  return null;
}


function audibleToKindle() {

  const t =
    parseTime(
      document.getElementById("audibleTime").value
    );

  const result =
    document.getElementById("kindleResult");

  const button =
    document.getElementById("saveKindleButton");

  if (isNaN(t)) {
    result.innerText = "Enter time as HH:MM";
    button.style.display = "none";
    return;
  }

  const pos = estimatePosition(t);

  if (pos === null) {
    result.innerText =
      "Outside calibrated range";
    button.style.display = "none";
    return;
  }

  predictedKindle = pos;

  result.innerText =
    "Kindle position ≈ " + pos;

  button.style.display = "block";
}


// ---------- Kindle -> Audible ----------

function estimateRemaining(position) {

  for (let i = 0; i < anchors.length - 1; i++) {

    const a = anchors[i];
    const b = anchors[i + 1];

    if (
      position >= a.position &&
      position <= b.position
    ) {

      const f =
        (position - a.position) /
        (b.position - a.position);

      return (
        a.remaining +
        f * (b.remaining - a.remaining)
      );
    }
  }

  return null;
}


function kindleToAudible() {

  const position =
    Number(
      document.getElementById(
        "kindlePosition"
      ).value
    );

  const result =
    document.getElementById("audibleResult");

  const remaining =
    estimateRemaining(position);

  if (remaining === null) {
    result.innerText =
      "Outside calibrated range";
    return;
  }

  result.innerText =
    "Audible ≈ " +
    formatTime(remaining) +
    " remaining";
}


// ---------- saved reading position ----------

function savePosition(position) {

  localStorage.setItem(
    "lastKindlePosition",
    position
  );

  showSaved();
}


function saveKindle() {

  if (predictedKindle !== null)
    savePosition(predictedKindle);
}


function saveEnteredKindle() {

  const position =
    Number(
      document.getElementById(
        "kindlePosition"
      ).value
    );

  if (position)
    savePosition(position);
}


function showSaved() {

  const p =
    localStorage.getItem(
      "lastKindlePosition"
    );

  const box =
    document.getElementById(
      "savedPosition"
    );

  if (!p) {
    box.innerText =
      "No position saved yet.";
    return;
  }

  box.innerText =
    "Kindle position " + p;
}


function continueOnAudible() {

  const p =
    Number(
      localStorage.getItem(
        "lastKindlePosition"
      )
    );

  if (!p) {
    alert("No Kindle position saved.");
    return;
  }

  const remaining =
    estimateRemaining(p);

  if (remaining === null) {
    alert(
      "Saved position is outside calibrated range."
    );
    return;
  }

  document.getElementById(
    "audibleResult"
  ).innerText =
    "Audible ≈ " +
    formatTime(remaining) +
    " remaining";

  document.getElementById(
    "kindlePosition"
  ).value = p;

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


showSaved();

</script>

</body>
</html>
